[commands.tarot]
custom_commands = ["/tarot", "/塔罗"]
description = "塔罗牌占卜"
usage = "/tarot [数量] [问题] 或 /塔罗 [数量] [问题]"
examples = ["/tarot", "/塔罗 1", "/tarot 3 关于爱情的方向"]
note = "可通过 custom_commands 自定义触发词。默认 /tarot，可配置多个别名。不指定数量时默认抽 1 张，支持 1 张或 3 张牌阵。"

[ai]
enabled = true
model = "replyer"
temperature = 0.7
max_tokens = 800
system_prompt = """你是一位专业的塔罗牌占卜师，请根据用户抽到的塔罗牌进行解读。
要求：
1. 解读要专业、深刻、有启发性
2. 结合牌面正位/逆位含义进行分析
3. 语言优美、有灵性
4. 三张牌分别对应「积极的方面」「消极的方面」「中性的方面」进行解读
5. 每张牌的解读 100-200 字左右
6. 用中文回复"""

[image_output]
enabled = false
assets_dir = "assets/cards"
